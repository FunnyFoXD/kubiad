apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubiad-manager-role
rules:
  - apiGroups:
      - apps.kubiad.dev
    resources:
      - workerapplications
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps.kubiad.dev
    resources:
      - workerapplications/status
    verbs:
      - update
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - get
      - list
      - update
      - watch
