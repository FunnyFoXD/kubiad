apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubiad-controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubiad-controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubiad-controller-manager
    spec:
      serviceAccountName: kubiad-controller-manager
      containers:
        - name: manager
          image: controller:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
