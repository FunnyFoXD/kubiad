apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scalablewebapplications.apps.kubiad.dev
spec:
  group: apps.kubiad.dev
  names:
    kind: ScalableWebApplication
    listKind: ScalableWebApplicationList
    plural: scalablewebapplications
    singular: scalablewebapplication
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .status.readyReplicas
          name: ReadyReplicas
          type: integer
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                image:
                  type: string
                  minLength: 1
                replicas:
                  type: integer
                  format: int32
                  default: 1
                  minimum: 0
                  maximum: 10
                port:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 65535
              required:
                - image
                - port
            status:
              type: object
              properties:
                phase:
                  type: string
                readyReplicas:
                  type: integer
                  format: int32
